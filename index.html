<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0C0C0D" />
    <meta name="robots" content="noindex" />
    <title>Painel da Lojinha</title>
    <!-- Applies the saved theme before the first paint (dark by default), so the page never flashes. -->
    <script>
      (function () {
        var t = 'dark';
        try {
          t = localStorage.getItem('painel-tema') || 'dark';
        } catch (e) {}
        if (t !== 'auto') document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
      })();
    </script>
    <link rel="icon" href="/logo.webp" type="image/webp" />
    <link rel="apple-touch-icon" href="/logo.webp" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
