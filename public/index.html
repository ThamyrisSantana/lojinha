<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C0C0D">
<meta name="robots" content="noindex">
<title>Painel da Lojinha</title>
<script>(function(){var t='dark';try{t=localStorage.getItem('painel-tema')||'dark'}catch(e){}if(t!=='auto')document.documentElement.dataset.theme=t==='light'?'light':'dark'})()</script>
<link rel="icon" href="logo.webp" type="image/webp">
<link rel="apple-touch-icon" href="logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip-link" href="#view">Pular para o conteúdo</a>

<section class="login" id="login" hidden>
  <form class="login-card" id="loginForm">
    <div class="logo"><img src="logo.webp" alt=""></div>
    <h1 id="loginTitle">Entrar no painel</h1>
    <p id="loginHint">Use o e-mail e a senha cadastrados no Supabase.</p>
    <label class="field" id="emailField"><span>E-mail</span><input type="email" id="lEmail" autocomplete="username" required></label>
    <label class="field"><span id="lPassLbl">Senha</span><input type="password" id="lPass" autocomplete="current-password" required minlength="6"></label>
    <button class="btn primary" type="submit" id="lBtn">Entrar</button>
    <div class="login-msg" id="lMsg" role="status"></div>
    <button class="link" type="button" id="lForgot">Esqueci minha senha</button>
  </form>
</section>

<div id="app" hidden>
  <aside class="side" id="side" aria-label="Menu">
    <div class="brand"><div class="logo"><img src="logo.webp" alt=""></div><div><b id="shopName">Minha lojinha</b><small>Painel da loja</small></div></div>
    <nav class="nav" id="nav" aria-label="Seções"></nav>
    <div class="side-foot">
      <div class="store-state" id="storeState"><i></i><span>Conectando…</span></div>
      <div class="seg theme-seg" id="themeSeg" role="group" aria-label="Tema"></div>
      <div class="side-actions">
        <button class="btn sm ghost" data-act="logout" id="logoutBtn" hidden>Sair</button>
      </div>
    </div>
  </aside>
  <div class="side-scrim" data-act="menu" aria-hidden="true"></div>
  <header class="mtop">
    <button class="icon-btn" data-act="menu" aria-label="Abrir menu" id="menuBtn"></button>
    <div class="brand"><div class="logo"><img src="logo.webp" alt=""></div><div><b id="mTitle">Visão geral</b><small id="mShop">Minha lojinha</small></div></div>
    <button class="icon-btn" data-act="theme" id="mThemeBtn"></button>
  </header>
  <main>
    <div class="demo-bar" id="demoBar" hidden>Modo demonstração: os dados ficam só neste navegador. Configure o Supabase em <span class="mono">config.js</span> para salvar na nuvem.</div>
    <div class="wrap" id="view" tabindex="-1"></div>
  </main>
  <nav class="bnav" id="bnav" aria-label="Atalhos"></nav>
</div>

<div id="drawerRoot"></div>
<div id="tip" aria-hidden="true" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script defer src="config.js"></script>
<!-- App scripts share one global scope and run in this order; app.js (last) starts the app. -->
<script defer src="js/utils.js"></script>
<script defer src="js/constants.js"></script>
<script defer src="js/store.js"></script>
<script defer src="js/calc.js"></script>
<script defer src="js/components.js"></script>
<script defer src="js/views.js"></script>
<script defer src="js/forms.js"></script>
<script defer src="js/app.js"></script>
</body>
</html>
